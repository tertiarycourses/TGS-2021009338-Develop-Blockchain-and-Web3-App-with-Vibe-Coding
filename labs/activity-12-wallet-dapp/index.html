<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local certificate verifier</title><style>body{font:18px system-ui;margin:3rem;max-width:850px;color:#161b26}button,input{font:inherit;padding:.6rem;margin:.3rem}pre{white-space:pre-wrap;background:#f5f8fc;padding:1rem}h1{color:#1f6feb}</style><h1>Certificate verification on an isolated test chain</h1><p>Deploy with --rpc to persistent Anvil. This page uses the current folder deployment.json and your EIP-1193 wallet. No signing key is stored by this page.</p><button id="connect">Connect test wallet</button><label>Certificate ID <input id="token" type="number" value="1" min="1"></label><button id="verify">Read certificate</button><pre id="result" aria-live="polite">Connect a disposable local test wallet to begin.</pre><script>
let manifest;const out=document.getElementById('result');const selectors={"ownerOf(uint256)": "6352211e", "documentHash(uint256)": "8b038336", "revoked(uint256)": "d5b141e7"};
async function load(){const r=await fetch('deployment.json',{cache:'no-store'});if(!r.ok)throw Error('Run local-RPC deployment first');manifest=await r.json();if(!manifest.rpc)throw Error('This manifest is in-process Py-EVM. Run --rpc against persistent Anvil.');}
async function chain(){if(!window.ethereum)throw Error('No EIP-1193 wallet found');const id=await window.ethereum.request({method:'eth_chainId'});if(BigInt(id)!==BigInt(manifest.chainId))throw Error('Chain mismatch: wallet '+id+' vs manifest '+manifest.chainId);}
document.getElementById('connect').onclick=async()=>{try{await load();if(!window.ethereum)throw Error('Install or unlock an EIP-1193 test wallet, then select the disposable local network.');const acc=await window.ethereum.request({method:'eth_requestAccounts'});await chain();out.textContent='Connected '+acc[0]+'\nChain '+manifest.chainId+'\nContract '+manifest.address;}catch(e){out.textContent='Error: '+e.message;}};
document.getElementById('verify').onclick=async()=>{try{await load();await chain();const id=BigInt(document.getElementById('token').value);if(id<1n)throw Error('ID must be positive');const word=id.toString(16).padStart(64,'0');async function read(sig){return window.ethereum.request({method:'eth_call',params:[{to:manifest.address,data:'0x'+selectors[sig]+word},'latest']});}const owner=await read('ownerOf(uint256)'),digest=await read('documentHash(uint256)'),revoked=await read('revoked(uint256)');out.textContent=JSON.stringify({chainId:manifest.chainId,address:manifest.address,tokenId:String(id),owner:'0x'+owner.slice(-40),digest,revoked:BigInt(revoked)!==0n,digestMatchesManifest:digest.toLowerCase()===manifest.documentDigest.toLowerCase()},null,2);}catch(e){out.textContent='Read failed: '+e.message;}};
</script></html>
